<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinOps Pro - Prestação de Contas</title>
    <link rel="stylesheet" href="../css/prestacao-contas.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <img src="../imgs/logo-com-nome.png" class="sidebar-logo">
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html" class="menu-item">📊 Dashboard</a>
            <a href="adiantamentos.html" class="menu-item">💸 Adiantamentos</a>
            <a href="prestacao-contas.html" class="menu-item active">🧾 Prestação de Contas</a>
            <a href="#" class="menu-item">✔️ Aprovações</a>
            <a href="#" class="menu-item">💳 Pagamentos</a>
            <a href="#" class="menu-item">🌎 Conversor</a>
            <a href="#" class="menu-item">📅 Feriados</a>
            <a href="#" class="menu-item">⚙️ Configurações</a>
        </nav>

    </aside>

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">

            <button id="menuToggle" class="menu-toggle">☰</button>

            <div class="topbar-right">

                <span class="user-name">Olá, Lucas!</span>

                <div class="user-avatar" id="avatarBtn">L</div>

                <!-- MENU DROPDOWN -->
                <div class="dropdown-menu" id="profileMenu">
                    <a href="../html/perfil.html" class="dropdown-item">👤 Perfil</a>
                    <a href="../html/login.html" class="dropdown-item logout">🔌 Logout</a>
                </div>

            </div>
        </header>

        <section class="content">

            <div class="page-header">
                <h1 class="page-title">Prestação de Contas</h1>
            </div>

            <!-- FILTERS -->
            <div class="filters-box">

                <div class="filter-group">
                    <label>Buscar</label>
                    <input type="text" id="searchInput" placeholder="Buscar por solicitante, valor, status...">
                </div>

                <div class="filter-group">
                    <label>Status</label>
                    <select id="statusFilter">
                        <option value="">Todos</option>
                        <option value="pendente">Pendente</option>
                        <option value="revisão">Revisão</option>
                        <option value="aprovado">Aprovado</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Data Inicial</label>
                    <input type="date" id="dataInicial">
                </div>

                <div class="filter-group">
                    <label>Data Final</label>
                    <input type="date" id="dataFinal">
                </div>
            </div>

            <!-- TABLE -->
            <div class="table-wrapper">
                <table class="main-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Solicitante</th>
                            <th>Descrição</th>
                            <th>Valor</th>
                            <th>Moeda</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>

        </section>
    </div>

    <script src="../js/prestacao-contas.js"></script>
</body>
</html>
