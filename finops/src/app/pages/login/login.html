<div class="login-wrapper">

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-area">
      <img src="assets/imgs/logo-sem-nome.png" alt="FinOps Pro" class="logo">
      <h1>FinOps Pro</h1>
      <p class="subtitle">Gestão financeira corporativa multimoeda</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="form">

      <!-- E-mail -->
      <div class="input-group">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="seuemail@empresa.com"
        />

        <span class="error-message" *ngIf="email?.touched && email?.invalid">
          Digite um e-mail válido.
        </span>
      </div>

      <!-- Senha -->
      <div class="input-group">
        <label for="password">Senha</label>

        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
          />

          <span
            (click)="togglePassword()"
            class="eye-icon"
          >
            {{ showPassword ? '❌' : '👁️' }}
          </span>
        </div>

        <span class="error-message" *ngIf="password?.touched && password?.invalid">
          A senha deve ter no mínimo 4 caracteres.
        </span>
      </div>

      <!-- Botão -->
      <button type="submit" class="btn-primary">
        Entrar
      </button>

      <a href="#" class="forgot-password">
        Esqueci minha senha
      </a>
    </form>

    <p class="footer">© 2025 FinOps Pro. Todos os direitos reservados.</p>

  </div>
</div>
