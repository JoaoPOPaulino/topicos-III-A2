<section class="content">

<h1 class="page-title">Novo Adiantamento</h1>

<form class="form-container" (ngSubmit)="salvar()">

    <div class="form-group">
        <label>Solicitante</label>
        <input type="text" [(ngModel)]="form.solicitante" name="solicitante" required placeholder="Nome do solicitante">
    </div>

    <div class="form-group">
        <label>Descrição</label>
        <input type="text" [(ngModel)]="form.descricao" name="descricao" required placeholder="Descreva o motivo do adiantamento">
    </div>

    <div class="row">

        <div class="form-group">
            <label>Valor</label>
            <input type="text" name="valor" [(ngModel)]="form.valor" (input)="mascaraValor($event)" placeholder="R$ 0,00" required>
        </div>

        <div class="form-group">
            <label>Moeda</label>
            <select [(ngModel)]="form.moeda" name="moeda">
                <option value="BRL">BRL</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>

        <div class="form-group">
            <label>Data</label>
            <input type="date" [(ngModel)]="form.data" name="data" required>
        </div>

    </div>

    <div class="form-group">
        <label>Categoria</label>
        <select [(ngModel)]="form.categoria" name="categoria">
            <option value="transporte">Transporte</option>
            <option value="alimentacao">Alimentação</option>
            <option value="hospedagem">Hospedagem</option>
            <option value="material">Material de Escritório</option>
            <option value="outros">Outros</option>
        </select>
    </div>

    <div class="form-group">
        <label>Anexos (opcional)</label>
        <input type="file" (change)="selecionarArquivos($event)" multiple>
    </div>

    <button class="btn-primary" type="submit">Salvar Adiantamento</button>

</form>

</section>
