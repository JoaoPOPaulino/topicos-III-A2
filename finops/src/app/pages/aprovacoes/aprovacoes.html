<section class="content-section aprovacoes">

  <div class="page-header">
    <h1>Aprovações</h1>

    <div class="page-actions">
      <input type="text" placeholder="Buscar por solicitante, descrição, valor..." [(ngModel)]="search" (ngModelChange)="applyFilters()" />
      <select [(ngModel)]="statusFilter" (change)="applyFilters()">
        <option value="">Todos</option>
        <option value="Pendente">Pendente</option>
        <option value="Revisão">Revisão</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Atrasado">Atrasado</option>
        <option value="Rejeitado">Rejeitado</option>
        <option value="Pago">Pago</option>
      </select>
      <input type="date" [(ngModel)]="dateFrom" (change)="applyFilters()" />
      <input type="date" [(ngModel)]="dateTo" (change)="applyFilters()" />
    </div>
  </div>

  <!-- table card -->
  <div class="table-wrapper">
    <table class="main-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Solicitante</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Moeda</th>
          <th>Data</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of pageItems">
          <td>{{ item.id }}</td>
          <td>{{ item.requester }}</td>
          <td>{{ item.description }}</td>
          <td>{{ formatMoney(item.amount, item.currency) }}</td>
          <td>{{ item.currency }}</td>
          <td>{{ item.date | date:'dd/MM/yyyy' }}</td>
          <td><span class="tag" [ngClass]="statusClass(item.status)">{{ item.status }}</span></td>
          <td class="actions">
            <button class="btn-view" (click)="verAdiantamento()">Ver</button>
            <button *ngIf="item.status === 'Pendente' || item.status === 'Revisão' || item.status === 'Atrasado'"
                    class="btn-edit"
                    (click)="goToEdit()">Editar</button>
          </td>
        </tr>

        <tr *ngIf="pageItems.length === 0">
          <td colspan="8" class="no-data">Nenhum registro encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- pagination control (format <--- 1 --->
  <div class="pagination">
    <button class="arrow" (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
    <div class="page-number">{{ currentPage }}</div>
    <button class="arrow" (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
  </div>

</section>
