<section class="content">

<div class="page-header">
    <h1 class="page-title">Adiantamentos</h1>
    <button class="btn-primary" (click)="novoAdiantamento()">+ Novo Adiantamento</button>
</div>

<!-- FILTERS -->
<div class="filters-box">

    <div class="filter-group">
        <label>Buscar</label>
        <input type="text" [(ngModel)]="search" (input)="filtrar()"
                placeholder="Buscar por solicitante, valor, status...">
    </div>

    <div class="filter-group">
        <label>Status</label>
        <select [(ngModel)]="status" (change)="filtrar()">
            <option value="">Todos</option>
            <option value="pendente">Pendente</option>
            <option value="revisão">Revisão</option>
            <option value="aprovado">Aprovado</option>
            <option value="pago">Pago</option>
        </select>
    </div>

    <div class="filter-group">
        <label>Data Inicial</label>
        <input type="date" [(ngModel)]="dataInicial" (change)="filtrar()">
    </div>

    <div class="filter-group">
        <label>Data Final</label>
        <input type="date" [(ngModel)]="dataFinal" (change)="filtrar()">
    </div>
</div>


<!-- TABLE -->
<div class="table-wrapper">
    <table class="main-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Solicitante</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Moeda</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let item of paginaAtualizada">
                <td>{{ item.id }}</td>
                <td>{{ item.nome }}</td>
                <td>{{ item.desc }}</td>
                <td>{{ item.valor }}</td>
                <td>{{ item.moeda }}</td>
                <td>{{ item.data | date:'dd/MM/yyyy' }}</td>

                <td>
                    <span class="tag {{ item.status }}">{{ item.status }}</span>
                </td>

                <td>
                    <button class="btn-view" (click)="verAdiantamento()">Ver</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- PAGINATION -->
<div class="pagination">

    <button class="arrow-btn"
        [disabled]="pagina === 1"
        (click)="paginaAnterior()">
    <
    </button>


    <div class="page-number">
        {{ pagina }}
    </div>

    <button class="arrow-btn"
        [disabled]="pagina === totalPaginas"
        (click)="paginaProxima()">
    >
    </button>


</div>

</section>
